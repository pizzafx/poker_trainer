<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Theory Optional · Play</title>
<link rel="stylesheet" href="src/ui/table.css">
</head>
<body>
<header id="top">
  <a class="brand" href="index.html" title="Home"><img class="tile" src="assets/logo/tile.svg" alt="" width="28" height="28"><span class="spade">♠</span><span class="brand-name"> Game Theory Optional</span></a>
  <div id="stats"></div>
  <!-- On a phone the buttons sit behind one Menu button; from 601px the menu is kept open and
       its summary hidden, so the buttons show in the header as before (see app.js, table.css). -->
  <details class="menu" id="menu" open>
    <summary aria-label="Menu"><i aria-hidden="true"></i>Menu</summary>
    <div class="top-actions">
      <button id="btn-side"><span class="d-only">Coach &amp; log</span><span class="m-only">Coach &amp; hand log</span></button>
      <button id="btn-review">Leak review<small class="m-only">Where your money is going, biggest leak first</small></button>
      <button id="btn-players">Players<small class="m-only">Who they are and how they play; change anything</small></button>
      <button id="btn-settings">Settings</button>
      <hr class="m-only">
      <button id="btn-sim-menu" class="m-only">Quick sim<small>Play 40 hands in a second so you sit down knowing the table</small></button>
      <a id="btn-faq" href="faq.html" target="_blank" rel="noopener">FAQ</a>
    </div>
  </details>
</header>
<main>
  <section id="stage">
    <div id="sim-wrap">
      <button id="btn-sim" class="fresh">⚡ Quick sim</button>
      <div id="sim-tip"><b>Skip the getting-to-know-you phase.</b> Plays 40 hands in about a second so you sit down already knowing something about every player. Your results in those hands do not count. Hover over a seat afterwards to see what you picked up.</div>
    </div>
    <div id="table">
      <div id="felt">
        <div id="pot"></div>
        <div id="board"></div>
      </div>
      <div id="seats"></div>
    </div>
    <div id="bottom">
      <div id="bottom-left">
        <div id="news"></div>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
      <div id="actions"></div>
    </div>
  </section>
  <aside id="side">
    <div class="tabs">
      <button id="tab-coach" class="on">Coach</button>
      <button id="tab-range">Ranges</button>
      <button id="tab-log">Hand log</button>
      <button id="side-close" title="Hide" aria-label="Hide panel">✕</button>
    </div>
    <div id="feedback"></div>
    <div id="ranges" class="hidden"></div>
    <div id="log" class="hidden"></div>
  </aside>
</main>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
